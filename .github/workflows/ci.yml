name: Handover checks

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: handover/package-lock.json
      - run: npm ci
      - run: npm run check:english
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:cloudflare
