<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Handover is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        background: #f6f4ef;
        color: #202d2a;
        font-family: sans-serif;
        padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
      }
      main {
        max-width: 36rem;
      }
      button {
        min-height: 44px;
        background: #246b56;
        color: #fff;
        border: 0;
        padding: 10px 14px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Handover needs a connection</h1>
      <p>
        The timetable and handover were not saved on this device. Nothing was
        submitted. Reconnect, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
